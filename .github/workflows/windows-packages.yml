name: Windows candidate packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.2.0-rc.7'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify tag and declared candidate
        shell: pwsh
        run: |
          $version = ([xml](Get-Content native/src/FnMusic.App/FnMusic.App.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -ne '0.2.0-rc.7') { throw 'Unexpected candidate version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'Tag differs from app version' }
      - name: Privacy review
        shell: pwsh
        run: |
          node scripts/check-privacy.js
          if ($LASTEXITCODE -ne 0) { throw 'Privacy check failed' }
          python scripts/audit-release-privacy.py --output .review-audit/github-privacy-candidates.json
          if ($LASTEXITCODE -ne 0) { throw 'History audit failed' }
      - name: Prepare pinned SDK
        shell: pwsh
        run: ./scripts/native.ps1 bootstrap
      - name: Consolidated checks
        shell: pwsh
        run: |
          ./scripts/native.ps1 test
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed' }
          & ./.tools/dotnet/dotnet.exe run --project native/tests/FnMusic.Tests/FnMusic.Tests.csproj --no-build --no-restore -- --verify-http-json
          if ($LASTEXITCODE -ne 0) { throw 'HTTP/JSON source checks failed' }
          & ./.tools/dotnet/dotnet.exe run --project native/tests/FnMusic.Tests/FnMusic.Tests.csproj --no-build --no-restore -- --verify-queue-session
          if ($LASTEXITCODE -ne 0) { throw 'Queue session checks failed' }
          node --test tests/*.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Node checks failed' }
          python -m unittest discover -s tests -p test_release_publication.py
          if ($LASTEXITCODE -ne 0) { throw 'Release integrity checks failed' }
          python scripts/test-portable-verification.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable integrity checks failed' }
      - name: Build verified ZIP and portable EXE
        shell: pwsh
        run: |
          ./scripts/package-preview.ps1 -Version 0.2.0-rc.7 -Name FnMusic-0.2.0-rc.7-win-x64
          ./scripts/package-windows.ps1 -Payload dist/FnMusic-0.2.0-rc.7-win-x64 -Name FnMusic-0.2.0-rc.7-win-x64-portable -PortableOnly
      - name: Verify candidate contents
        shell: pwsh
        run: |
          python scripts/verify-portable-package.py --packages dist/FnMusic-0.2.0-rc.7-win-x64-portable --payload dist/FnMusic-0.2.0-rc.7-win-x64 --report .review-audit/portable-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Portable verification failed' }
          python scripts/verify-icon-resources.py --icon assets/branding/fnmusic.ico dist/FnMusic-0.2.0-rc.7-win-x64/FnMusic.App.exe dist/FnMusic-0.2.0-rc.7-win-x64-portable/FnMusic-0.2.0-rc.7-win-x64-portable.exe
          if ($LASTEXITCODE -ne 0) { throw 'Application icon verification failed' }
      - name: Upload candidate build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FnMusic-0.2.0-rc.7-win-x64
          path: |
            dist/FnMusic-0.2.0-rc.7-win-x64.zip
            dist/FnMusic-0.2.0-rc.7-win-x64.SHA256SUMS.txt
            dist/FnMusic-0.2.0-rc.7-win-x64-portable/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

name: Windows candidate release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.2.0-rc.9'

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify tag and declared candidate
        shell: pwsh
        run: |
          $version = ([xml](Get-Content native/src/Melvune.App/Melvune.App.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -ne '0.2.0-rc.9') { throw 'Unexpected candidate version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'Tag differs from app version' }
      - name: Privacy review
        shell: pwsh
        run: |
          node scripts/check-privacy.js
          if ($LASTEXITCODE -ne 0) { throw 'Privacy check failed' }
          python scripts/audit-release-privacy.py --output .review-audit/github-privacy-candidates.json
          if ($LASTEXITCODE -ne 0) { throw 'History audit failed' }
      - name: Prepare pinned SDK
        shell: pwsh
        run: ./scripts/native.ps1 bootstrap
      - name: Consolidated checks
        shell: pwsh
        run: |
          ./scripts/native.ps1 test
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed' }
          & ./.tools/dotnet/dotnet.exe run --project native/tests/Melvune.Tests/Melvune.Tests.csproj --no-build --no-restore -- --verify-http-json
          if ($LASTEXITCODE -ne 0) { throw 'HTTP/JSON source checks failed' }
          & ./.tools/dotnet/dotnet.exe run --project native/tests/Melvune.Tests/Melvune.Tests.csproj --no-build --no-restore -- --verify-queue-session
          if ($LASTEXITCODE -ne 0) { throw 'Queue session checks failed' }
          node --test tests/*.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Node checks failed' }
          python scripts/test-portable-verification.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable integrity checks failed' }
          python -m unittest discover -s tests -p test_release_publication.py
          if ($LASTEXITCODE -ne 0) { throw 'Release publication checks failed' }
          python -m unittest discover -s tests -p test_preview_cleanup.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview cleanup checks failed' }
          python -m unittest discover -s tests -p test_installer_authoring.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer authoring checks failed' }
          python -m unittest discover -s tests -p test_installer_arguments.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer argument checks failed' }
      - name: Build ZIP, portable EXE, setup EXE and MSI
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 -Version 0.2.0-rc.9 -Name Melvune-0.2.0-rc.9-win-x64
          ./scripts/package-windows.ps1 -Payload dist/Melvune-0.2.0-rc.9-win-x64 -Name Melvune-0.2.0-rc.9-win-x64-portable
      - name: Verify candidate contents
        shell: pwsh
        run: |
          python scripts/verify-portable-package.py --packages dist/Melvune-0.2.0-rc.9-win-x64-portable --payload dist/Melvune-0.2.0-rc.9-win-x64 --report .review-audit/portable-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Portable verification failed' }
          python scripts/verify-icon-resources.py --icon assets/branding/melvune.ico dist/Melvune-0.2.0-rc.9-win-x64/Melvune.App.exe dist/Melvune-0.2.0-rc.9-win-x64-portable/Melvune-0.2.0-rc.9-win-x64-portable.exe dist/Melvune-0.2.0-rc.9-win-x64-portable-installers/Melvune-0.2.0-rc.9-win-x64-setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Application icon verification failed' }
      - name: Stage verified release assets
        shell: pwsh
        run: |
          python scripts/release-candidate.py stage --directory dist/release-assets --payload dist/Melvune-0.2.0-rc.9-win-x64 --packages dist/Melvune-0.2.0-rc.9-win-x64-portable --installers dist/Melvune-0.2.0-rc.9-win-x64-portable-installers --source $env:GITHUB_SHA --run-url "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Release staging failed' }
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Melvune-0.2.0-rc.9-win-x64
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  installation:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Melvune-0.2.0-rc.9-win-x64
          path: dist/release-assets
      - name: Verify downloaded assets and extract payload
        shell: pwsh
        run: |
          python scripts/release-candidate.py verify --directory dist/release-assets --source $env:GITHUB_SHA --run-url "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded release assets failed verification' }
          Expand-Archive -LiteralPath dist/release-assets/Melvune-0.2.0-rc.9-win-x64.zip -DestinationPath .review-audit/install-payload
      - name: Exercise MSI and EXE install and uninstall
        shell: pwsh
        run: ./scripts/test-installer-smoke.ps1 -Packages dist/release-assets -Payload .review-audit/install-payload/Melvune-0.2.0-rc.9-win-x64

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.2.0-rc.9'
    needs: [package, installation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Melvune-0.2.0-rc.9-win-x64
          path: dist/release-assets
      - name: Verify assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release-candidate.py publish
          --directory dist/release-assets --source "$GITHUB_SHA"
          --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

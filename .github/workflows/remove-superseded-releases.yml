name: Remove superseded releases

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/remove-superseded-releases.yml'

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'JuuWaii/fnmusic_pc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Remove the two approved old releases and verify the retained candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/remove-superseded-releases.py
